services:
  - type: web
    name: astra-ai-backend
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build && npm run migrate
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: astra-ai-db
          property: connectionString
      - key: ASTRA_JWT_SECRET
        generateValue: true
      - key: ASTRA_PASSWORD_HASH
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: DEEPINFRA_API_KEY
        sync: false

databases:
  - name: astra-ai-db
    plan: starter
    region: oregon
    databaseName: astra_ai
    user: astra_user
